name: Sovereign Build

on:
  push:
    branches: ["sovereign"]
    paths-ignore:
      - README.md
      - README-SOVEREIGN-VPS.md
      - scripts/install-sovereign.sh
      - scripts/upgrade-sovereign.sh
      - scripts/update-sovereign-from-repo.sh
      - docker-compose.sovereign.prod.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Sovereign Coolify
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:sovereign
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=sovereign-amd64
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache-sovereign-amd64
          cache-to: type=gha,mode=max,scope=sovereign-amd64
