# Mac dev overlay: amd64 emulation + node healthcheck, no private digital-goods-source image.
services:
  coolify:
    image: "${COOLIFY_IMAGE:-ghcr.io/vv1ldd/coolify:sovereign}"
    pull_policy: always
    platform: linux/amd64
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      simple-l1:
        condition: service_healthy

  soketi:
    image: "${SOVEREIGN_REALTIME_IMAGE:-ghcr.io/coollabsio/coolify-realtime:1.0.13}"
    pull_policy: always
    platform: linux/amd64
    extra_hosts:
      - host.docker.internal:host-gateway

  simple-l1:
    image: "${SIMPLE_L1_IMAGE:-ghcr.io/vv1ldd/simple-l1:latest}"
    container_name: simple-l1
    pull_policy: always
    platform: linux/amd64
    restart: always
    networks:
      - coolify
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${SOVEREIGN_TUNNEL_SIMPLE_L1_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      SL1_DATA_DIR: /data/simple-l1
      NODE_NAME: "${SIMPLE_L1_NODE_NAME:-sovereign-coolify-node}"
      NETWORK_NAME: "${SIMPLE_L1_NETWORK_NAME:-Simple-L1}"
      NODE_TYPE_LABEL: "${SIMPLE_L1_NODE_TYPE_LABEL:-Sovereign Coolify Node}"
      SELF_WEBHOOK: "${SIMPLE_L1_SELF_WEBHOOK:-}"
      PEERS: "${SIMPLE_L1_PEERS:-}"
      SL1_STORAGE_ROLE: "${SIMPLE_L1_STORAGE_ROLE:-cache}"
      SL1_IDENTITY_PROTOCOL_VERSION: "${SIMPLE_L1_IDENTITY_PROTOCOL_VERSION:-capsule-v0}"
      SL1_IDENTITY_CAPSULES_ENABLED: "${SIMPLE_L1_IDENTITY_CAPSULES_ENABLED:-true}"
      SL1_EVIDENCE_RESOLVERS: "${SIMPLE_L1_EVIDENCE_RESOLVERS:-local-cache,client-capsule,peer,signed-export}"
      SL1_STATE_RESOLVERS: "${SIMPLE_L1_STATE_RESOLVERS:-local-cache,peer,anchor,quorum,signed-export}"
      SL1_DEFAULT_ASSURANCE_LEVEL: "${SIMPLE_L1_DEFAULT_ASSURANCE_LEVEL:-AL1}"
      SL1_NAMESPACE_AUTO_ALLOCATE: "${SIMPLE_L1_NAMESPACE_AUTO_ALLOCATE:-false}"
      SL1_NAMESPACE_ZONE: "${SIMPLE_L1_DOMAIN:-simplel1.online}"
      CLOUDFLARE_API_TOKEN: "${SIMPLE_L1_CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ZONE_ID: "${SIMPLE_L1_CLOUDFLARE_ZONE_ID:-}"
      CLOUDFLARE_ZONE_NAME: "${SIMPLE_L1_DOMAIN:-simplel1.online}"
      CLOUDFLARE_PROXIED: "${SIMPLE_L1_CLOUDFLARE_PROXIED:-false}"
    volumes:
      - simple-l1-data:/data/simple-l1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 20
      timeout: 3s

  digital-goods-source:
    image: "${DIGITAL_GOODS_SOURCE_IMAGE:-ghcr.io/vv1ldd/digital-goods-source:latest}"
    container_name: digital-goods-source
    pull_policy: never
    platform: linux/amd64
    restart: always
    networks:
      - coolify
    expose:
      - "8080"
    ports:
      - "${DIGITAL_GOODS_SOURCE_BIND:-127.0.0.1}:${DIGITAL_GOODS_SOURCE_PORT:-8091}:8080"
    environment:
      APP_NAME: "Digital Goods Source"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${DIGITAL_GOODS_SOURCE_PUBLIC_URL:-http://digital-goods-source:8080}"
      DB_CONNECTION: sqlite
      DB_DATABASE: "${DIGITAL_GOODS_SOURCE_DB_DATABASE:-/data/digital-goods-source.sqlite}"
      DIGITAL_GOODS_SOURCE_SERVICE_NAME: digital-goods-source
      DIGITAL_GOODS_SOURCE_RUNTIME_VERSION: "${DIGITAL_GOODS_SOURCE_RUNTIME_VERSION:-1.0.0}"
      DIGITAL_GOODS_SOURCE_KERNEL_PROTOCOL_VERSION: "${DIGITAL_GOODS_SOURCE_KERNEL_PROTOCOL_VERSION:-v1}"
      DIGITAL_GOODS_SOURCE_PROVIDER_CONTRACT_VERSION: "${DIGITAL_GOODS_SOURCE_PROVIDER_CONTRACT_VERSION:-v1}"
      DIGITAL_GOODS_SOURCE_PLATFORM_TOKEN: "${DIGITAL_GOODS_SOURCE_PLATFORM_TOKEN:-}"
      DIGITAL_GOODS_SOURCE_FINANCIAL_SECRET: "${DIGITAL_GOODS_SOURCE_FINANCIAL_SECRET:-}"
      DIGITAL_GOODS_SOURCE_SIGNATURE_TOLERANCE: "${DIGITAL_GOODS_SOURCE_SIGNATURE_TOLERANCE:-300}"
    volumes:
      - digital-goods-source-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/status | grep -q 'digital-goods-source' || exit 1"]
      interval: 10s
      retries: 20
      timeout: 3s

volumes:
  simple-l1-data:
    name: simple-l1-data
  digital-goods-source-data:
    name: digital-goods-source-data

networks:
  coolify:
    external: true
